plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.104'
}

version = '0.0.3'
group = 'bonetorch'

base {
	archivesName = 'SBM-BoneTorch-1.20.4'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

processResources {
	exclude ".cache"
}

sourceSets.main.resources {
	srcDir 'src/generated/resources' //include generated files
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        workingDirectory project.file('run/client')
    }

    server {
        workingDirectory project.file('run/server')
        programArgument '-nogui'
    }

    data {
		workingDirectory project.file('run/data')
		programArguments.addAll '--mod', 'bonetorch', '--all', '--output', file('src/generated/resources/').getAbsolutePath()
	}
}

repositories {
    maven {
        url "https://www.cursemaven.com"
    }
}

dependencies {
    implementation 'net.neoforged:neoforge:20.4.234'

    //implementation "curse.maven:silent-lib-242998:3543045" //torch bandolier dependency
    //implementation "curse.maven:torch-bandolier-299337:3550328"
}

tasks.named('jar', Jar).configure {
	exclude('bl4ckscor3/mod/bonetorch/datagen/**') //exclude files from the built jar that are only used to generate the assets & data

    manifest {
        attributes(["Specification-Title": "SBM-BoneTorch",
                    "Specification-Vendor": "Built Broken Modding",
                    "Specification-Version": "${version}",
                    "Implementation-Title": "SBM-BoneTorch",
                    "Implementation-Version": "${version}",
                    "Implementation-Vendor" :"Built Broken Modding"],)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 17
}